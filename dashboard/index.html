<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Intrusion Detection Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 2rem; }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; margin-left: 8px; }
  .online { background: #1e7e34; }
  .offline { background: #6c1e1e; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #24262e; font-size: 0.9rem; }
  th { color: #9aa0a6; font-weight: 500; }
  .confidence-high { color: #ff6b6b; font-weight: 600; }
  .confidence-low { color: #d0d0d0; }
</style>
</head>
<body>
  <h1>Live Intrusion Events <span id="conn-status" class="status offline">connecting…</span></h1>
  <table>
    <thead>
      <tr><th>Time</th><th>Device</th><th>Event</th><th>Confidence</th><th>Raw</th></tr>
    </thead>
    <tbody id="event-rows"></tbody>
  </table>

  <!-- Load Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    // Fill in with your Firebase web app config (Project Settings -> General -> Your apps)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const statusEl = document.getElementById('conn-status');
    const rowsEl = document.getElementById('event-rows');

    db.collection('intrusion_events')
      .orderBy('receivedAt', 'desc')
      .limit(50)
      .onSnapshot(
        (snapshot) => {
          statusEl.textContent = 'live';
          statusEl.className = 'status online';
          rowsEl.innerHTML = '';
          snapshot.forEach((doc) => {
            const e = doc.data();
            const time = new Date(e.receivedAt).toLocaleTimeString();
            const confClass = e.confidence >= 80 ? 'confidence-high' : 'confidence-low';
            rowsEl.insertAdjacentHTML('beforeend', `
              <tr>
                <td>${time}</td>
                <td>${e.device ?? ''}</td>
                <td>${e.event ?? ''}</td>
                <td class="${confClass}">${e.confidence ?? ''}%</td>
                <td>${e.raw ?? ''}</td>
              </tr>
            `);
          });
        },
        (err) => {
          statusEl.textContent = 'offline';
          statusEl.className = 'status offline';
          console.error(err);
        }
      );
  </script>
</body>
</html>
